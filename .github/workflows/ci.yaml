name: CI

# Every job is mandatory: no continue-on-error and no optional matrix entries. The
# behavioural and release-artifact matrices cover every upstream-supported
# stable PHP 8 minor on musl and glibc. EOL minors are intentionally excluded.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Rust tests, clippy gate and phpt (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (pinned by otel/rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache-workspaces: otel
          cache-key: php-${{ matrix.php-version }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Build test extension
        working-directory: otel
        run: |
          echo "TEST_PHP_EXECUTABLE=$(which php)" >> "$GITHUB_ENV"
          make build-test
          sudo cp target/debug/libotel.so "$(php-config --extension-dir)/otel.so"
          php -n -d extension=otel.so --ri otel >/dev/null

      - name: Panic-site lint gate
        working-directory: otel
        run: make lint

      - name: Cargo tests
        working-directory: otel
        run: cargo test --features test

      - name: Install PHP fixtures
        working-directory: otel
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          composer_flags=(--no-dev --no-interaction --no-progress)
          (cd tests/auto/zf1 && composer install "${composer_flags[@]}")
          laminas_flags=("${composer_flags[@]}")
          if [[ "$PHP_VERSION" == "8.5" ]]; then
            # Laminas MVC 3.8 declares support through PHP 8.4. Exercise it on
            # 8.5 while ignoring only that upper bound, not other requirements.
            laminas_flags+=(--ignore-platform-req=php+)
          fi
          (cd tests/auto/laminas && composer install "${laminas_flags[@]}")
          (cd tests/auto/laravel && composer install "${composer_flags[@]}")
          (cd tests/auto/psr18 && composer install "${composer_flags[@]}")
          (cd tests/auto/symfony && composer install "${composer_flags[@]}")
          (cd tests/reflection && composer install "${composer_flags[@]}")

      - name: phpt, HTTP and auto-instrumentation suites
        working-directory: otel
        run: php run-tests.php -q --show-diff tests/phpt tests/http tests/auto

  supply-chain:
    name: Advisories, licences and sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: otel/Cargo.toml
          command: check
          arguments: --all-features

  integration:
    name: Manifest, export isolation, transport and lifecycle (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHP_VERSION: '8.2'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the php test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: PHP_VERSION=8.2
          tags: php-rust:8.2
          load: true
          cache-from: type=gha,scope=php-rust-8.2
          cache-to: type=gha,scope=php-rust-8.2,mode=max

      - name: Build release extension
        run: |
          mkdir -p otel/.cargo/registry otel/.cargo/git otel/modules otel/target otel/tests/reflection/vendor
          # Dockerfile runs the build as php-rust (UID/GID 1000), while GitHub's
          # checkout belongs to the runner user. Only generated paths need write access.
          sudo chown -R 1000:1000 otel/.cargo otel/modules otel/target otel/tests/reflection/vendor
          docker compose run --rm php make build

      - name: Verification matrix
        run: make integration

  release-artifacts:
    name: PHP ${{ matrix.php-version }} ${{ matrix.libc.name }} ${{ matrix.platform.arch }} artifact
    runs-on: ubuntu-latest
    needs: [unit, supply-chain]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        platform:
          - docker: linux/arm64
            arch: aarch64
          - docker: linux/amd64
            arch: x86_64
        libc:
          - name: musl
            dockerfile: Dockerfile.alpine
            runtime-suffix: fpm-alpine3.23
          - name: glibc
            dockerfile: Dockerfile.glibc
            runtime-suffix: fpm-bookworm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build PHP ${{ matrix.php-version }} ${{ matrix.platform.arch }}-${{ matrix.libc.name }} otel.so
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.libc.dockerfile }}
          target: artifact
          platforms: ${{ matrix.platform.docker }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            RUST_VERSION=1.97.1
          outputs: type=local,dest=dist/php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }}
          cache-from: type=gha,scope=artifact-php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }}
          cache-to: type=gha,scope=artifact-php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }},mode=max

      - name: Load the extension in the target image and record ABI metadata
        run: |
          set -euo pipefail
          out="dist/php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }}"
          stem="otel-php${{ matrix.php-version }}-${{ matrix.platform.arch }}-linux-${{ matrix.libc.name }}"
          so="${out}/${stem}.so"
          abi="${out}/${stem}.abi.json"
          runtime_image="php:${{ matrix.php-version }}-${{ matrix.libc.runtime-suffix }}"
          mv "${out}/otel.so" "${so}"
          docker pull --platform ${{ matrix.platform.docker }} "${runtime_image}"
          runtime_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${runtime_image}")"
          docker run --rm --platform ${{ matrix.platform.docker }} \
            -e OTEL_ARTIFACT_LIBC=${{ matrix.libc.name }} \
            -e OTEL_ARTIFACT_RUNTIME_IMAGE="${runtime_image}" \
            -e OTEL_ARTIFACT_RUNTIME_IMAGE_DIGEST="${runtime_digest}" \
            -v "$PWD/${so}:/otel.so:ro" \
            -v "$PWD/otel/tests/integration/abi_metadata.php:/abi_metadata.php:ro" \
            "${runtime_image}" sh -ec '
              if [ "${OTEL_ARTIFACT_LIBC}" = musl ]; then
                apk add --no-cache libgcc >/dev/null
              fi
              export OTEL_ARTIFACT_LIBC_VERSION="$(ldd --version 2>&1 | head -n 1 || true)"
              php -n -d extension=/otel.so /abi_metadata.php' \
            > "${abi}"
          jq -e \
            --arg php "${{ matrix.php-version }}" \
            --arg arch "${{ matrix.platform.arch }}" \
            --arg libc "${{ matrix.libc.name }}" \
            '.php_version | startswith($php + ".")' "${abi}" >/dev/null
          jq -e \
            --arg arch "${{ matrix.platform.arch }}" \
            --arg libc "${{ matrix.libc.name }}" \
            --arg runtime "${runtime_image}" \
            '.arch == $arch and .libc == $libc and .linkage == "dynamic" and .thread_safe == false and .debug_build == false and .runtime_image == $runtime and (.runtime_image_digest | contains("@sha256:"))' \
            "${abi}" >/dev/null
          cat "${abi}"
          (cd "${out}" && sha256sum "${stem}.so" "${stem}.abi.json" > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }}/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: otel-php${{ matrix.php-version }}-${{ matrix.platform.arch }}-linux-${{ matrix.libc.name }}
          path: dist/php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.libc.name }}
          if-no-files-found: error

  release-metadata:
    name: SBOM, licence inventory and vulnerability report
    runs-on: ubuntu-latest
    needs: [supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: otel
      - name: Install generators
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Generate
        working-directory: otel
        run: |
          set -euo pipefail
          mkdir -p ../dist/metadata
          cargo cyclonedx --format json --all-features --describe binaries
          mv otel_cdylib.cdx.json ../dist/metadata/otel-sbom.cdx.json
          cargo about generate about.hbs -o ../dist/metadata/THIRD_PARTY_LICENSES.html
          cargo deny --all-features list --layout license > ../dist/metadata/license-inventory.txt
          cargo deny --all-features check advisories 2>&1 | tee ../dist/metadata/advisories.txt
          cp rust-toolchain.toml deny.toml ../dist/metadata/
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: dist/metadata
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [integration, release-artifacts, release-metadata]
    permissions:
      contents: write
    steps:
      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'otel-php*'
          path: dist
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: dist/release-metadata
      - name: Combined checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/**/*.so
            dist/**/*.abi.json
            dist/release-metadata/*
          generate_release_notes: true
