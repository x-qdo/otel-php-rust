[package]
name = "otel"
version = "0.18.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[features]
test = []
# Opt-in global allocator. Neutral at typical sampling rates; measured about 20%
# faster request-thread cost under an always-on export burst at the price of
# 1-2 MiB extra RSS per process. See README "Allocator".
mimalloc = ["dep:mimalloc"]

[lib]
name = "otel"
crate-type = ["cdylib"]

[profile.release]
strip = "debuginfo"
# Explicit panic strategy: panics unwind and are caught at every FFI boundary
# (phper `invoke`, module/request hooks, object handlers, observer hooks) and
# surface as a catchable PHP \Error or a logged no-op. `abort` would take down
# the whole PHP-FPM worker or CLI process on any internal bug.
panic = "unwind"

[dependencies]
phper = { path = "third_party/phper" }
opentelemetry = { version = "0.31.0", features = ["internal-logs"] }
opentelemetry-http = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["testing"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "gzip-http", "gzip-tonic", "tls-webpki-roots"] }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
# Pure-Rust TLS (rustls/ring + bundled webpki roots) for both OTLP transports: no OpenSSL
# runtime dependency in the musl release image.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
rustls-pki-types = "1"
http = "1"
async-trait = "0.1"
opentelemetry-semantic-conventions = "0.31.0"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.20.3"
anyhow = "1.0.95"
chrono = "0.4.39"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dotenvy = "0.15.7"
futures-executor = "0.3.31"
futures-util = "0.3.31"
hostname = "0.4.1"
lazy_static = "1.5.0"
regex = "1.11.1"
url = "2.5.4"
mimalloc = { version = "0.1.48", optional = true }

[build-dependencies]
cargo_metadata = "0.23.0"
phper-sys = "0.15.6"

[dev-dependencies]
phper-test = "0.16.2"
