[package]
name = "otel"
version = "0.18.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
test = []
# Opt-in global allocator. Neutral at typical sampling rates; measured about 20%
# faster request-thread cost under an always-on export burst at the price of
# 1-2 MiB extra RSS per process. See README "Allocator".
mimalloc = ["dep:mimalloc"]

[lib]
name = "otel"
crate-type = ["cdylib"]

[profile.release]
strip = "debuginfo"

[dependencies]
phper = { path = "third_party/phper" }
opentelemetry = { version = "0.31.0", features = ["internal-logs"] }
opentelemetry-http = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["testing"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "gzip-http", "gzip-tonic"] }
opentelemetry-semantic-conventions = "0.31.0"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.20.3"
anyhow = "1.0.95"
chrono = "0.4.39"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dotenvy = "0.15.7"
futures-executor = "0.3.31"
futures-util = "0.3.31"
hostname = "0.4.1"
lazy_static = "1.5.0"
regex = "1.11.1"
url = "2.5.4"
mimalloc = { version = "0.1.48", optional = true }

[build-dependencies]
cargo_metadata = "0.23.0"
phper-sys = "0.15.3"

[dev-dependencies]
phper-test = "0.16.0"
