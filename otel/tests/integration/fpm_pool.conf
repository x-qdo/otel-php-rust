[global]
error_log = /proc/self/fd/2
log_level = notice
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = static
pm.max_children = 2
; Exercise worker recycling on top of the explicit reload/termination steps.
pm.max_requests = 25
catch_workers_output = yes
clear_env = no
